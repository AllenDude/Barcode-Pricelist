<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Inventory Scanner</title>

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- ==========================
         HEADER
    =========================== -->

    <header class="page-header">

        <div>

            <h1>📦 Inventory Scanner</h1>

            <p class="page-subtitle">

                Scan • Search • Manage Products

            </p>

        </div>

    </header>

    <!-- ==========================
         SEARCH
    =========================== -->

    <section class="search-container">

        <input

            id="manualSearchInput"

            type="text"

            placeholder="Search barcode..."

            autocomplete="off"

        >

        <button id="manualSearchBtn">

            🔍

        </button>

        <button id="toggleCostBtn">

            👁

        </button>

        <button id="viewAllBtn">

            📦

        </button>

    </section>

    <!-- ==========================
         SCANNER
    =========================== -->

    <section class="scanner-container">

        <div id="reader"></div>

        <button id="startScannerBtn">

            📷 Start Scanner

        </button>

    </section>
    
        <!-- ==========================
         PRODUCT CARD
    =========================== -->

    <section

        id="productInfo"

        class="product-card hidden"

    >

        <div class="product-header">

            <div>

                <h2 id="productName">

                    Product Name

                </h2>

            </div>

            <div class="dropdown">

                <button

                    class="dropdown-btn"

                    aria-label="Product Menu"

                >

                    ⋮

                </button>

                <div class="dropdown-content">

                    <a

                        href="#"

                        id="editProduct"

                    >

                        ✏️ Edit

                    </a>

                    <a

                        href="#"

                        id="deleteProduct"

                    >

                        🗑️ Delete

                    </a>

                </div>

            </div>

        </div>

        <div

            id="productBarcode"

            class="product-barcode"

        >

            #000000000000

        </div>

        <button

            id="copyBarcodeBtn"

            class="copy-btn"

        >

            📋 Copy Barcode

        </button>

        <p

            id="productSalePrice"

            class="sale-price"

        >

            ₱0.00

        </p>

        <p

            id="productCostPrice"

            class="cost-price"

        >

            *****

        </p>

    </section>
    
        <!-- ==========================
         PRODUCT NOT FOUND
    =========================== -->

    <section

        id="notFound"

        class="not-found hidden"

    >

        <h2>

            ❌ Product Not Found

        </h2>

        <p>

            This barcode doesn't exist in your inventory.

        </p>

        <button id="addProductBtn">

            ➕ Add Product

        </button>

    </section>

    <!-- ==========================
         RECENT SCANS
    =========================== -->

    <section class="recent-scans">

        <h3>

            🕒 Recent Scans

        </h3>

        <div id="recentScansList">

            <p class="center">

                No recent scans.

            </p>

        </div>

    </section>

</div>

<!-- ==========================
     ADD / EDIT PRODUCT MODAL
=========================== -->

<div

    id="productModal"

    class="modal hidden"

>

    <div class="modal-content">

        <span class="close">

            &times;

        </span>

        <h3 id="modalTitle">

            Add Product

        </h3>

        <form id="productForm">

            <input

                type="hidden"

                id="barcodeCode"

            >

            <label>

                Product Name

            </label>

            <input

                id="productNameInput"

                type="text"

                required

            >

            <label>

                Cost Price (₱)

            </label>

            <input

                id="productCostInput"

                type="number"

                step="0.01"

                required

            >

            <label>

                Sale Price (₱)

            </label>

            <input

                id="productPriceInput"

                type="number"

                step="0.01"

                required

            >

            <label>

                Additional Barcodes

            </label>

            <div class="alias-input-group">

                <input

                    id="productAliasesInput"

                    type="text"

                    placeholder="12345,67890"

                >

                <button

                    type="button"

                    id="scanAliasBtn"

                    class="scan-alias-btn"

                >

                    📷

                </button>

            </div>

            <button type="submit">

                💾 Save Product

            </button>

        </form>

    </div>

</div>

<!-- ==========================
     ALIAS SCANNER
=========================== -->

<div

    id="aliasScannerOverlay"

    class="modal hidden"

>

    <div class="modal-content scanner-modal">

        <span class="close-alias-scanner">

            &times;

        </span>

        <h3>

            Scan Additional Barcode

        </h3>

        <div id="aliasReader"></div>

        <button

            id="stopAliasScannerBtn"

            class="secondary-btn"

        >

            Stop Scanner

        </button>

    </div>

</div>

<!-- ==========================
     SCRIPTS
=========================== -->

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="common.js"></script>
<script src="script.js"></script>

</body>

</html>
