<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Checkout</title>

    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="scan.css">
    <link rel="stylesheet" href="checkout.css">

</head>
<body>

<!-- ========== TOP BAR ========== -->
<header class="topbar">
    <button id="closePageBtn" class="topbar-back" title="Back">←</button>
    <div class="topbar-title">
        <h1>🛒 Checkout</h1>
        <span id="checkoutSummary">0 items • ₱0.00</span>
    </div>
</header>

<div class="container">

    <!-- ========== SCAN ZONE ========== -->
    <section class="card checkout-scan-card">

        <div class="search-bar">
            <input id="scanInput" type="text" placeholder="Scan or enter barcode…" autocomplete="off" autofocus>
            <button id="scanSearchBtn" class="icon-btn primary" title="Look up">🔍</button>
        </div>

        <div class="camera-toggle-row">
            <button id="toggleBackCamBtn" class="camera-toggle-btn">
                <span>📷</span> Back Cam
            </button>
            <button id="toggleFrontCamBtn" class="camera-toggle-btn">
                <span>🤳</span> Front Cam
            </button>
        </div>

        <div id="cameraFrame" class="scan-frame compact hidden">
            <div id="cameraReader"></div>
        </div>

        <div id="scanStatus" class="scan-status hidden"></div>

    </section>

    <!-- ========== NOT FOUND ========== -->
    <section id="notFoundCard" class="card empty-state hidden">
        <div class="empty-icon">❌</div>
        <h3>Product not found</h3>
        <p>This barcode isn't in your inventory yet.</p>
        <div id="notFoundBarcode" class="barcode-chip" style="margin:10px auto;">#000000000000</div>
        <div class="not-found-actions">
            <button id="rescanBtn" class="btn btn-ghost">🔄 Rescan</button>
            <button id="addProductBtn" class="btn btn-success btn-block">➕ Add Product</button>
        </div>
    </section>

    <!-- ========== CART ========== -->
    <section class="card cart-card">

        <span class="section-label">🧾 Current Sale</span>

        <div id="cartList" class="cart-list">
            <div class="empty-cart">Cart is empty. Scan an item to begin.</div>
        </div>

    </section>

    <!-- ========== TOTALS ========== -->
    <section class="card totals-card">

        <div class="totals-row">
            <span>Items</span>
            <span id="cartItemCount">0</span>
        </div>

        <div class="totals-row total-final">
            <span>Total</span>
            <span id="cartTotal">₱0.00</span>
        </div>

        <div class="checkout-actions">
            <button id="clearCartBtn" class="btn btn-ghost" title="Clear cart">🗑 Clear</button>
            <button id="completeSaleBtn" class="btn btn-success btn-block">✅ Complete Sale</button>
        </div>

    </section>

</div>

<!-- ========== BOTTOM NAV ========== -->
<nav class="bottom-nav">
    <button id="goToScanBtn" class="nav-tab">
        <span class="nav-icon">📷</span> Scan
    </button>
    <button class="nav-tab active">
        <span class="nav-icon">🛒</span> Checkout
    </button>
    <button id="goToListBtn" class="nav-tab">
        <span class="nav-icon">📦</span> Inventory
    </button>
</nav>

<!-- ========== ADD PRODUCT SHEET ========== -->
<div id="addProductOverlay" class="sheet-overlay hidden">
    <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <h3>Add Product</h3>
            <button class="sheet-close close-add-product">&times;</button>
        </div>

        <div id="addProductBarcode" class="barcode-chip" style="margin-bottom:14px;">#000000000000</div>

        <form id="addProductForm">

            <div class="field">
                <label>Product Name</label>
                <input id="addProductName" type="text" required>
            </div>

            <div class="field-row">
                <div class="field">
                    <label>Cost Price (₱)</label>
                    <input id="addProductCost" type="number" step="0.01" required>
                </div>
                <div class="field">
                    <label>Sale Price (₱)</label>
                    <input id="addProductPrice" type="number" step="0.01" required>
                </div>
            </div>

            <button type="submit" class="btn btn-success btn-block" style="margin-top:6px;">➕ Add &amp; Ring Up</button>

        </form>
    </div>
</div>

<!-- ========== EDIT CART ITEM SHEET ========== -->
<div id="editCartItemOverlay" class="sheet-overlay hidden">
    <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <h3>Edit Product</h3>
            <button class="sheet-close close-edit-cart-item">&times;</button>
        </div>

        <form id="editCartItemForm">
            <input type="hidden" id="editCartItemCode">

            <div class="field">
                <label>Product Name</label>
                <input id="editCartItemName" type="text" required>
            </div>

            <div class="field-row">
                <div class="field">
                    <label>Cost Price (₱)</label>
                    <input id="editCartItemCost" type="number" step="0.01" required>
                </div>
                <div class="field">
                    <label>Sale Price (₱)</label>
                    <input id="editCartItemPrice" type="number" step="0.01" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px;">💾 Save Changes</button>
        </form>
    </div>
</div>

<!-- ========== RECEIPT SHEET ========== -->
<div id="receiptOverlay" class="sheet-overlay hidden">
    <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <h3>Receipt</h3>
            <button class="sheet-close close-receipt">&times;</button>
        </div>

        <div id="receiptContent" class="receipt">
            <div class="receipt-store">MENDOZA'S STORE</div>
            <div id="receiptMeta" class="receipt-meta"></div>
            <div class="receipt-divider"></div>
            <div id="receiptItems" class="receipt-items"></div>
            <div class="receipt-divider"></div>
            <div class="receipt-total-row">
                <span>TOTAL</span>
                <span id="receiptTotal">₱0.00</span>
            </div>
            <div class="receipt-footer">Thank you for your purchase!</div>
        </div>

        <div class="receipt-actions">
            <button id="printReceiptBtn" class="btn btn-ghost">🖨️ Print</button>
            <button id="doneReceiptBtn" class="btn btn-success btn-block">✅ Done</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="common.js"></script>
<script src="checkout.js"></script>

</body>
</html>
