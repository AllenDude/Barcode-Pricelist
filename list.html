<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Inventory</title>

    <link rel="stylesheet" href="list.css">

</head>

<body>

<div class="container">

    <!-- ==========================
         HEADER
    =========================== -->

    <header class="page-header">

        <div>

            <h1>📦 Inventory</h1>

            <p class="page-subtitle">

                Browse • Search • Manage Products

            </p>

        </div>

        <div class="header-buttons">

            <button
                id="toggleCostListBtn"
                title="Toggle Cost">

                👁

            </button>

            <button
                id="closePageBtn"
                title="Back">

                ←

            </button>

        </div>

    </header>

    <!-- ==========================
         SEARCH
    =========================== -->

    <section class="search-wrapper">

        <input

            id="searchInput"

            type="text"

            placeholder="Search by name, barcode or alias..."

            autocomplete="off"

        >

    </section>

    <!-- ==========================
         PRODUCT COUNT
    =========================== -->

    <div id="productCount">

        0 Products

    </div>

    <!-- ==========================
         PRODUCT LIST
    =========================== -->

    <section

        id="productList"

        class="product-list"

    >

        <div class="loading">

            Loading inventory...

        </div>

    </section>

</div>

<!-- ==========================
     EDIT PRODUCT MODAL
=========================== -->

<div

    id="editModal"

    class="modal hidden"

>

    <div class="modal-content">

        <span class="close-modal">

            &times;

        </span>

        <h3>

            Edit Product

        </h3>

        <form id="editForm">

            <input
                id="editCode"
                type="hidden">

            <label>

                Product Name

            </label>

            <input

                id="editName"

                type="text"

                required

            >

            <label>

                Cost Price (₱)

            </label>

            <input

                id="editCost"

                type="number"

                step="0.01"

                required

            >

            <label>

                Sale Price (₱)

            </label>

            <input

                id="editPrice"

                type="number"

                step="0.01"

                required

            >

            <label>

                Additional Barcodes

            </label>

            <div class="alias-input-group">

                <input

                    id="editAliases"

                    type="text"

                    placeholder="12345,67890"

                >

                <button

                    type="button"

                    id="scanEditAliasBtn"

                >

                    📷

                </button>

            </div>

            <button type="submit">

                💾 Save Changes

            </button>

        </form>

    </div>

</div>

<!-- ==========================
     ALIAS SCANNER
=========================== -->

<div

    id="editAliasScannerOverlay"

    class="modal hidden"

>

    <div class="modal-content scanner-modal">

        <span class="close-edit-scanner">

            &times;

        </span>

        <h3>

            Scan Additional Barcode

        </h3>

        <div id="editAliasReader"></div>

        <button

            id="stopEditAliasScannerBtn"

            class="secondary-btn"

        >

            Stop Scanner

        </button>

    </div>

</div>

<div id="alphabetScrollbar" class="alphabet-scrollbar"></div>

<div id="letterPreview" class="letter-preview hidden">
    A
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="common.js"></script>
<script src="list.js"></script>

</body>

</html>
